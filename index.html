<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow — Personal To-Do List</title>

<style>
    /* =========================
       Design tokens
    ========================== */
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef2f7;
      --text: #18202d;
      --muted: #6b7280;
      --border: #dfe5ee;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --danger: #ef4444;
      --warning: #f97316;
      --success: #16a34a;
      --shadow: 0 12px 35px rgba(31, 41, 55, 0.08);
      --radius: 18px;
    }

[data-theme="dark"] {
      --bg: #111827;
      --surface: #1f2937;
      --surface-2: #273449;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
    }

* {
      box-sizing: border-box;
    }

body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      line-height: 1.45;
      transition: background 0.25s, color 0.25s;
    }

button,
    input,
    textarea,
    select {
      font: inherit;
    }

button {
      cursor: pointer;
    }

.app-shell {
      width: min(1440px, 100%);
      margin: auto;
      padding: 28px;
    }

/* =========================
       Header
    ========================== */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 26px;
    }

.brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

.brand-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-radius: 14px;
      font-size: 23px;
      box-shadow: 0 10px 24px rgba(99, 102, 241, 0.3);
    }

h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

h1 {
      margin-bottom: 2px;
      font-size: clamp(1.45rem, 2vw, 2rem);
      letter-spacing: -0.04em;
    }

.subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

.header-actions,
    .button-row,
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

.button,
    .icon-button {
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 14px;
      color: var(--text);
      background: var(--surface);
      transition: transform 0.18s, background 0.18s, border 0.18s;
    }

.button:hover,
    .icon-button:hover {
      transform: translateY(-1px);
      border-color: var(--primary);
    }

.button.primary {
      border-color: var(--primary);
      color: white;
      background: var(--primary);
    }

.button.primary:hover {
      background: var(--primary-dark);
    }

.icon-button {
      width: 42px;
      height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
    }

/* =========================
       Summary cards
    ========================== */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 22px;
    }

.summary-card {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

.summary-label {
      color: var(--muted);
      font-size: 0.83rem;
    }

.summary-value {
      margin: 5px 0 3px;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

.summary-detail {
      color: var(--muted);
      font-size: 0.78rem;
    }

.progress-track {
      height: 8px;
      overflow: hidden;
      margin-top: 11px;
      border-radius: 99px;
      background: var(--surface-2);
    }

.progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), #8b5cf6);
      transition: width 0.35s ease;
    }

/* =========================
       Layout and toolbar
    ========================== */
    .workspace {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

.sidebar,
    .main-panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

.sidebar {
      padding: 16px;
      position: sticky;
      top: 20px;
    }

.sidebar-title {
      padding: 6px 10px 12px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

.filter-button {
      width: 100%;
      display: flex;
      justify-content: space-between;
      border: 0;
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--text);
      background: transparent;
      text-align: left;
      transition: background 0.18s;
    }

.filter-button:hover,
    .filter-button.active {
      color: var(--primary);
      background: var(--surface-2);
      font-weight: 700;
    }

.filter-count {
      color: var(--muted);
      font-size: 0.78rem;
    }

.main-panel {
      min-width: 0;
      padding: 18px;
    }

.toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 17px;
    }

.search-box {
      min-width: 180px;
      flex: 1;
    }

.input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border 0.18s, box-shadow 0.18s;
    }

.input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.13);
    }

.task-list {
      display: grid;
      gap: 11px;
    }

/* =========================
       Task card
    ========================== */
    .task-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 13px;
      align-items: start;
      padding: 15px;
      border: 1px solid var(--border);
      border-left: 5px solid var(--primary);
      border-radius: 14px;
      background: var(--surface);
      transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
      animation: slide-in 0.25s ease both;
    }

.task-card:hover {
      box-shadow: 0 8px 20px rgba(31, 41, 55, 0.09);
    }

.task-card.dragging {
      opacity: 0.45;
      transform: scale(0.98);
    }

.task-card.priority-high {
      border-left-color: var(--danger);
    }

.task-card.priority-medium {
      border-left-color: var(--warning);
    }

.task-card.priority-low {
      border-left-color: var(--success);
    }

.task-card.completed {
      opacity: 0.65;
    }

.task-card.completed .task-title {
      color: var(--muted);
      text-decoration: line-through;
    }

.check-button {
      width: 24px;
      height: 24px;
      margin-top: 2px;
      border: 2px solid var(--border);
      border-radius: 50%;
      color: white;
      background: transparent;
      transition: transform 0.2s, background 0.2s;
    }

.check-button:hover {
      transform: scale(1.08);
      border-color: var(--primary);
    }

.completed .check-button {
      border-color: var(--success);
      background: var(--success);
    }

.task-title {
      margin: 0 0 4px;
      font-size: 1rem;
    }

.task-description {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 0.87rem;
      white-space: pre-wrap;
    }

.task-meta {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.76rem;
    }

.badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 99px;
      padding: 4px 8px;
      font-size: 0.7rem;
      font-weight: 800;
    }

.badge.high {
      color: #b91c1c;
      background: #fee2e2;
    }

.badge.medium {
      color: #c2410c;
      background: #ffedd5;
    }

.badge.low {
      color: #15803d;
      background: #dcfce7;
    }

[data-theme="dark"] .badge.high {
      color: #fecaca;
      background: #7f1d1d;
    }

[data-theme="dark"] .badge.medium {
      color: #fed7aa;
      background: #7c2d12;
    }

[data-theme="dark"] .badge.low {
      color: #bbf7d0;
      background: #14532d;
    }

.overdue {
      color: var(--danger);
      font-weight: 800;
    }

.task-actions {
      display: flex;
      gap: 5px;
    }

.task-actions button {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
    }

.task-actions button:hover {
      color: var(--primary);
      background: var(--surface-2);
    }

.checklist {
      display: grid;
      gap: 4px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 0.8rem;
    }

.checklist label {
      display: flex;
      gap: 6px;
      align-items: center;
    }

/* =========================
       Empty state and modal
    ========================== */
    .empty-state {
      padding: 62px 20px;
      color: var(--muted);
      text-align: center;
    }

.empty-icon {
      margin-bottom: 10px;
      font-size: 2.8rem;
    }

.modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
    }

.modal-backdrop.open {
      display: grid;
    }

.modal {
      width: min(680px, 100%);
      max-height: 92vh;
      overflow: auto;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
      animation: modal-in 0.22s ease both;
    }

.modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

.modal-header h2 {
      margin: 0;
      letter-spacing: -0.03em;
    }

.form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

.form-field {
      display: grid;
      gap: 6px;
    }

.form-field.full {
      grid-column: 1 / -1;
    }

.form-field label {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }

.checklist-editor {
      display: grid;
      gap: 8px;
    }

.checklist-row {
      display: flex;
      gap: 7px;
    }

.modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 20px;
    }

.toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 40;
      max-width: 320px;
      padding: 12px 15px;
      border-radius: 12px;
      color: white;
      background: #111827;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }

.toast.show {
      opacity: 1;
      transform: translateY(0);
    }

@keyframes slide-in {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

@keyframes modal-in {
      from {
        opacity: 0;
        transform: scale(0.97) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

@media (max-width: 900px) {
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }

.workspace {
        grid-template-columns: 1fr;
      }

.sidebar {
        position: static;
      }

.sidebar-filters {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }
    }

@media (max-width: 600px) {
      .app-shell {
        padding: 16px;
      }

.app-header,
      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

.header-actions,
      .toolbar-group {
        justify-content: stretch;
      }

.header-actions .button,
      .toolbar-group .button,
      .toolbar-group .select {
        flex: 1;
      }

.summary-grid {
        gap: 9px;
      }

.summary-card {
        padding: 13px;
      }

.summary-value {
        font-size: 1.35rem;
      }

.sidebar-filters {
        grid-template-columns: repeat(2, 1fr);
      }

.form-grid {
        grid-template-columns: 1fr;
      }

.form-field.full {
        grid-column: auto;
      }

.task-card {
        grid-template-columns: auto 1fr;
      }

.task-actions {
        grid-column: 2;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">✓</div>
        <div>
          <h1>FocusFlow</h1>
          <p class="subtitle">A calm place for everything you need to do.</p>
        </div>
      </div>

<div class="header-actions">
        <button class="button" id="focusBtn" title="Show high-priority tasks due today">
          🎯 Focus mode
        </button>
        <button class="button" id="exportBtn">Export</button>
        <button class="button" id="importBtn">Import</button>
        <input id="importFile" type="file" accept="application/json" hidden />
        <button class="icon-button" id="themeBtn" title="Toggle light/dark mode">🌙</button>
        <button class="button primary" id="newTaskBtn">＋ New task</button>
      </div>
    </header>

<section class="summary-grid" aria-label="Productivity summary">
      <article class="summary-card">
        <div class="summary-label">Today</div>
        <div class="summary-value" id="todayProgressText">0%</div>
        <div class="summary-detail" id="todayDetail">0 of 0 tasks complete</div>
        <div class="progress-track"><div class="progress-fill" id="todayProgress"></div></div>
      </article>

<article class="summary-card">
        <div class="summary-label">This week</div>
        <div class="summary-value" id="weekProgressText">0%</div>
        <div class="summary-detail" id="weekDetail">0 of 0 tasks complete</div>
        <div class="progress-track"><div class="progress-fill" id="weekProgress"></div></div>
      </article>

<article class="summary-card">
        <div class="summary-label">Time remaining</div>
        <div class="summary-value" id="remainingTime">0m</div>
        <div class="summary-detail">Across active tasks</div>
      </article>

<article class="summary-card">
        <div class="summary-label">Completion streak</div>
        <div class="summary-value" id="streakValue">0 days</div>
        <div class="summary-detail">Consecutive days with completed tasks</div>
      </article>
    </section>

<div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-title">Views</div>
        <div class="sidebar-filters">
          <button class="filter-button active" data-filter="all">All <span class="filter-count"></span></button>
          <button class="filter-button" data-filter="active">Active <span class="filter-count"></span></button>
          <button class="filter-button" data-filter="completed">Completed <span class="filter-count"></span></button>
          <button class="filter-button" data-filter="today">Today <span class="filter-count"></span></button>
          <button class="filter-button" data-filter="week">This week <span class="filter-count"></span></button>
          <button class="filter-button" data-filter="overdue">Overdue <span class="filter-count"></span></button>
          <button class="filter-button" data-filter="high">High priority <span class="filter-count"></span></button>
        </div>

<div class="sidebar-title" style="margin-top: 18px;">Categories</div>
        <div id="categoryFilters" class="sidebar-filters"></div>
      </aside>

<main class="main-panel">
        <div class="toolbar">
          <input class="input search-box" id="searchInput" placeholder="Search tasks, notes, or categories…" />
          <div class="toolbar-group">
            <select class="select" id="sortSelect" aria-label="Sort tasks">
              <option value="created">Date created</option>
              <option value="priority">Priority</option>
              <option value="due">Due date</option>
              <option value="estimate">Estimated time</option>
            </select>
            <button class="button" id="clearCompletedBtn">Clear completed</button>
          </div>
        </div>

<div class="task-list" id="taskList"></div>
      </main>
    </div>
  </div>

<!-- Task editor -->
  <div class="modal-backdrop" id="taskModal">
    <form class="modal" id="taskForm">
      <div class="modal-header">
        <h2 id="modalTitle">New task</h2>
        <button type="button" class="icon-button" id="closeModalBtn">×</button>
      </div>

<input id="taskId" type="hidden" />

<div class="form-grid">
        <div class="form-field full">
          <label for="title">Title *</label>
          <input class="input" id="title" required maxlength="160" placeholder="What needs to be done?" />
        </div>

<div class="form-field full">
          <label for="description">Description / notes</label>
          <textarea class="textarea" id="description" rows="3" placeholder="Add useful context…"></textarea>
        </div>

<div class="form-field">
          <label for="priority">Priority</label>
          <select class="select" id="priority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </div>

<div class="form-field">
          <label for="category">Category / tag</label>
          <input class="input" id="category" placeholder="Work, Personal, Health…" />
        </div>

<div class="form-field">
          <label for="dueDate">Due date</label>
          <input class="input" id="dueDate" type="date" />
        </div>

<div class="form-field">
          <label for="dueTime">Optional time</label>
          <input class="input" id="dueTime" type="time" />
        </div>

<div class="form-field">
          <label for="estimate">Estimated time</label>
          <input class="input" id="estimate" placeholder="30 min, 2 hours…" />
        </div>

<div class="form-field">
          <label for="recurrence">Recurring task</label>
          <select class="select" id="recurrence">
            <option value="none">Does not repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
          </select>
        </div>

<div class="form-field full">
          <label>Checklist</label>
          <div class="checklist-editor" id="checklistEditor"></div>
          <button type="button" class="button" id="addChecklistBtn">＋ Add checklist item</button>
        </div>
      </div>

<div class="modal-footer">
        <button type="button" class="button" id="cancelModalBtn">Cancel</button>
        <button type="submit" class="button primary">Save task</button>
      </div>
    </form>
  </div>

<div class="toast" id="toast"></div>

<script>
    /*
      FocusFlow
      ----------
      Offline-first task manager.
      Data is stored in localStorage under TASK_STORAGE_KEY.
    */

const TASK_STORAGE_KEY = "focusflow.tasks.v1";
    const SETTINGS_STORAGE_KEY = "focusflow.settings.v1";

let tasks = loadTasks();
    let settings = loadSettings();
    let currentFilter = "all";
    let draggedTaskId = null;

const $ = (selector) => document.querySelector(selector);

const elements = {
      taskList: $("#taskList"),
      taskModal: $("#taskModal"),
      taskForm: $("#taskForm"),
      modalTitle: $("#modalTitle"),
      checklistEditor: $("#checklistEditor"),
      searchInput: $("#searchInput"),
      sortSelect: $("#sortSelect"),
      toast: $("#toast")
    };

function loadTasks() {
      try {
        return JSON.parse(localStorage.getItem(TASK_STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

function loadSettings() {
      try {
        return JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

function saveTasks() {
      localStorage.setItem(TASK_STORAGE_KEY, JSON.stringify(tasks));
    }

function saveSettings() {
      localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings));
    }

function createId() {
      return crypto.randomUUID
        ? crypto.randomUUID()
        : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

function todayISO() {
      const date = new Date();
      const offset = date.getTimezoneOffset();
      return new Date(date.getTime() - offset * 60000).toISOString().slice(0, 10);
    }

function parseDateTime(task) {
      if (!task.dueDate) return null;
      return new Date(`${task.dueDate}T${task.dueTime || "23:59"}`);
    }

function isToday(task) {
      return task.dueDate === todayISO();
    }

function isThisWeek(task) {
      if (!task.dueDate) return false;

const date = new Date(`${task.dueDate}T12:00`);
      const now = new Date();
      const start = new Date(now);
      const day = start.getDay();
      const mondayOffset = day === 0 ? -6 : 1 - day;

start.setDate(start.getDate() + mondayOffset);
      start.setHours(0, 0, 0, 0);

const end = new Date(start);
      end.setDate(end.getDate() + 7);

return date >= start && date < end;
    }

function isOverdue(task) {
      return !task.completed && parseDateTime(task) && parseDateTime(task) < new Date();
    }

function priorityWeight(priority) {
      return { high: 1, medium: 2, low: 3 }[priority] || 2;
    }

function parseMinutes(value) {
      if (!value) return 0;

const text = value.toLowerCase().trim();
      const hours = Number(text.match(/([\d.]+)\s*h/)?.[1] || 0);
      const minutes = Number(text.match(/([\d.]+)\s*m/)?.[1] || 0);

if (!hours && !minutes && !Number.isNaN(Number(text))) {
        return Number(text);
      }

return Math.round(hours * 60 + minutes);
    }

function formatMinutes(minutes) {
      if (!minutes) return "0m";
      const hours = Math.floor(minutes / 60);
      const mins = minutes % 60;

if (!hours) return `${mins}m`;
      if (!mins) return `${hours}h`;
      return `${hours}h ${mins}m`;
    }

function escapeHTML(value = "") {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

function formatDue(task) {
      if (!task.dueDate) return "";

const date = new Date(`${task.dueDate}T${task.dueTime || "12:00"}`);
      const label = date.toLocaleDateString(undefined, {
        month: "short",
        day: "numeric",
        year: date.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined
      });

return task.dueTime
        ? `${label}, ${task.dueTime}`
        : label;
    }

function filteredTasks() {
      const search = elements.searchInput.value.toLowerCase().trim();

let result = tasks.filter((task) => {
        const matchesSearch =
          !search ||
          [task.title, task.description, task.category]
            .join(" ")
            .toLowerCase()
            .includes(search);

if (!matchesSearch) return false;

switch (currentFilter) {
          case "active": return !task.completed;
          case "completed": return task.completed;
          case "today": return isToday(task);
          case "week": return isThisWeek(task);
          case "overdue": return isOverdue(task);
          case "high": return task.priority === "high";
          default:
            return currentFilter.startsWith("category:")
              ? task.category === currentFilter.slice(9)
              : true;
        }
      });

const sort = elements.sortSelect.value;

result.sort((a, b) => {
        if (sort === "priority") {
          return priorityWeight(a.priority) - priorityWeight(b.priority);
        }

if (sort === "due") {
          return (parseDateTime(a)?.getTime() || Infinity) -
            (parseDateTime(b)?.getTime() || Infinity);
        }

if (sort === "estimate") {
          return parseMinutes(a.estimate) - parseMinutes(b.estimate);
        }

return (a.createdAt || 0) - (b.createdAt || 0);
      });

return result;
    }

function render() {
      renderTasks();
      renderFilters();
      renderSummary();
      updateThemeButton();
    }

function renderTasks() {
      const visibleTasks = filteredTasks();

if (!visibleTasks.length) {
        elements.taskList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${tasks.length ? "✨" : "📝"}</div>
            <h3>${tasks.length ? "Nothing matches this view" : "Your list is clear"}</h3>
            <p>${tasks.length
              ? "Try another filter or search term."
              : "Add your first task and make today count."}</p>
            ${!tasks.length ? `<button class="button primary" onclick="openNewTask()">＋ Add a task</button>` : ""}
          </div>
        `;
        return;
      }

elements.taskList.innerHTML = visibleTasks.map(renderTask).join("");
    }

function renderTask(task) {
      const dueClass = isOverdue(task) ? "overdue" : "";
      const checklist = (task.checklist || []).length
        ? `<div class="checklist">
            ${task.checklist.map((item, index) => `
              <label>
                <input type="checkbox"
                  ${item.done ? "checked" : ""}
                  onchange="toggleChecklist('${task.id}', ${index})" />
                <span>${escapeHTML(item.text)}</span>
              </label>
            `).join("")}
          </div>`
        : "";

return `
        <article
          class="task-card priority-${task.priority} ${task.completed ? "completed" : ""}"
          draggable="true"
          data-task-id="${task.id}"
          ondragstart="dragStart(event)"
          ondragover="dragOver(event)"
          ondrop="dropTask(event)"
        >
          <button class="check-button" onclick="toggleTask('${task.id}')"
            aria-label="${task.completed ? "Mark incomplete" : "Mark complete"}">
            ${task.completed ? "✓" : ""}
          </button>

<div>
            <h3 class="task-title">${escapeHTML(task.title)}</h3>
            ${task.description ? `<p class="task-description">${escapeHTML(task.description)}</p>` : ""}

<div class="task-meta">
              <span class="badge ${task.priority}">${task.priority}</span>
              ${task.category ? `<span>🏷 ${escapeHTML(task.category)}</span>` : ""}
              ${task.dueDate ? `<span class="${dueClass}">📅 ${formatDue(task)}${isOverdue(task) ? " · overdue" : ""}</span>` : ""}
              ${task.estimate ? `<span>⏱ ${escapeHTML(task.estimate)}</span>` : ""}
              ${task.recurrence !== "none" ? `<span>↻ ${task.recurrence}</span>` : ""}
            </div>

${checklist}
          </div>

<div class="task-actions">
            <button onclick="openEditTask('${task.id}')" title="Edit task">✎</button>
            <button onclick="deleteTask('${task.id}')" title="Delete task">🗑</button>
          </div>
        </article>
      `;
    }

function renderFilters() {
      const counts = {
        all: tasks.length,
        active: tasks.filter((t) => !t.completed).length,
        completed: tasks.filter((t) => t.completed).length,
        today: tasks.filter(isToday).length,
        week: tasks.filter(isThisWeek).length,
        overdue: tasks.filter(isOverdue).length,
        high: tasks.filter((t) => t.priority === "high").length
      };

document.querySelectorAll("[data-filter]").forEach((button) => {
        const filter = button.dataset.filter;
        button.classList.toggle("active", filter === currentFilter);
        button.querySelector(".filter-count").textContent = counts[filter] ?? "";
      });

const categories = [...new Set(tasks.map((task) => task.category).filter(Boolean))].sort();

$("#categoryFilters").innerHTML = categories.length
        ? categories.map((category) => `
            <button class="filter-button ${currentFilter === `category:${category}` ? "active" : ""}"
              onclick="setFilter('category:${escapeHTML(category)}')">
              ${escapeHTML(category)}
              <span class="filter-count">${tasks.filter((t) => t.category === category).length}</span>
            </button>
          `).join("")
        : `<span style="padding: 0 10px; color: var(--muted); font-size: .8rem;">No categories yet</span>`;
    }

function renderSummary() {
      const todayTasks = tasks.filter(isToday);
      const weekTasks = tasks.filter(isThisWeek);
      const todayDone = todayTasks.filter((task) => task.completed).length;
      const weekDone = weekTasks.filter((task) => task.completed).length;

const todayPercent = todayTasks.length ? Math.round(todayDone / todayTasks.length * 100) : 0;
      const weekPercent = weekTasks.length ? Math.round(weekDone / weekTasks.length * 100) : 0;

$("#todayProgressText").textContent = `${todayPercent}%`;
      $("#todayDetail").textContent = `${todayDone} of ${todayTasks.length} tasks complete`;
      $("#todayProgress").style.width = `${todayPercent}%`;

$("#weekProgressText").textContent = `${weekPercent}%`;
      $("#weekDetail").textContent = `${weekDone} of ${weekTasks.length} tasks complete`;
      $("#weekProgress").style.width = `${weekPercent}%`;

const remaining = tasks
        .filter((task) => !task.completed)
        .reduce((sum, task) => sum + parseMinutes(task.estimate), 0);

$("#remainingTime").textContent = formatMinutes(remaining);
      $("#streakValue").textContent = `${calculateStreak()} day${calculateStreak() === 1 ? "" : "s"}`;
    }

function calculateStreak() {
      const completedDates = new Set(
        tasks
          .filter((task) => task.completed && task.completedAt)
          .map((task) => task.completedAt.slice(0, 10))
      );

let streak = 0;
      const cursor = new Date();

while (completedDates.has(cursor.toISOString().slice(0, 10))) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      }

return streak;
    }

function openNewTask() {
      elements.taskForm.reset();
      $("#taskId").value = "";
      $("#priority").value = "medium";
      $("#recurrence").value = "none";
      elements.modalTitle.textContent = "New task";
      renderChecklistEditor([]);
      elements.taskModal.classList.add("open");
      setTimeout(() => $("#title").focus(), 50);
    }

function openEditTask(id) {
      const task = tasks.find((item) => item.id === id);
      if (!task) return;

$("#taskId").value = task.id;
      $("#title").value = task.title;
      $("#description").value = task.description || "";
      $("#priority").value = task.priority;
      $("#category").value = task.category || "";
      $("#dueDate").value = task.dueDate || "";
      $("#dueTime").value = task.dueTime || "";
      $("#estimate").value = task.estimate || "";
      $("#recurrence").value = task.recurrence || "none";

elements.modalTitle.textContent = "Edit task";
      renderChecklistEditor(task.checklist || []);
      elements.taskModal.classList.add("open");
      setTimeout(() => $("#title").focus(), 50);
    }

function closeModal() {
      elements.taskModal.classList.remove("open");
    }

function renderChecklistEditor(items) {
      elements.checklistEditor.innerHTML = items.map((item) => `
        <div class="checklist-row">
          <input class="input checklist-input" value="${escapeHTML(item.text)}" placeholder="Checklist item" />
          <button type="button" class="icon-button remove-checklist">×</button>
        </div>
      `).join("");

document.querySelectorAll(".remove-checklist").forEach((button) => {
        button.addEventListener("click", () => button.parentElement.remove());
      });
    }

function getChecklistFromEditor() {
      return [...document.querySelectorAll(".checklist-input")]
        .map((input) => ({ text: input.value.trim(), done: false }))
        .filter((item) => item.text);
    }

function saveTaskFromForm(event) {
      event.preventDefault();

const id = $("#taskId").value;
      const existing = tasks.find((task) => task.id === id);

const task = {
        id: id || createId(),
        title: $("#title").value.trim(),
        description: $("#description").value.trim(),
        priority: $("#priority").value,
        category: $("#category").value.trim(),
        dueDate: $("#dueDate").value,
        dueTime: $("#dueTime").value,
        estimate: $("#estimate").value.trim(),
        recurrence: $("#recurrence").value,
        checklist: getChecklistFromEditor(),
        completed: existing?.completed || false,
        completedAt: existing?.completedAt || null,
        createdAt: existing?.createdAt || Date.now()
      };

if (!task.title) return;

if (existing) {
        Object.assign(existing, task);
      } else {
        tasks.unshift(task);
      }

saveTasks();
      closeModal();
      render();
      showToast(existing ? "Task updated" : "Task added");
    }

function toggleTask(id) {
      const task = tasks.find((item) => item.id === id);
      if (!task) return;

task.completed = !task.completed;
      task.completedAt = task.completed ? new Date().toISOString() : null;

/*
        Recurring tasks create the next occurrence when completed.
      */
      if (task.completed && task.recurrence !== "none" && task.dueDate) {
        const nextDate = new Date(`${task.dueDate}T12:00`);
        nextDate.setDate(nextDate.getDate() + (task.recurrence === "daily" ? 1 : 7));

tasks.unshift({
          ...task,
          id: createId(),
          dueDate: nextDate.toISOString().slice(0, 10),
          completed: false,
          completedAt: null,
          createdAt: Date.now(),
          checklist: (task.checklist || []).map((item) => ({ ...item, done: false }))
        });
      }

saveTasks();
      render();
      showToast(task.completed ? "Task completed 🎉" : "Task marked active");
    }

function toggleChecklist(taskId, index) {
      const task = tasks.find((item) => item.id === taskId);
      if (!task?.checklist?.[index]) return;

task.checklist[index].done = !task.checklist[index].done;
      saveTasks();
      render();
    }

function deleteTask(id) {
      const task = tasks.find((item) => item.id === id);
      if (!task) return;

if (!confirm(`Delete “${task.title}”?`)) return;

tasks = tasks.filter((item) => item.id !== id);
      saveTasks();
      render();
      showToast("Task deleted");
    }

function setFilter(filter) {
      currentFilter = filter;
      render();
    }

function dragStart(event) {
      draggedTaskId = event.currentTarget.dataset.taskId;
      event.currentTarget.classList.add("dragging");
    }

function dragOver(event) {
      event.preventDefault();
    }

function dropTask(event) {
      event.preventDefault();

const targetId = event.currentTarget.dataset.taskId;
      if (!draggedTaskId || draggedTaskId === targetId) return;

const fromIndex = tasks.findIndex((task) => task.id === draggedTaskId);
      const toIndex = tasks.findIndex((task) => task.id === targetId);

const [moved] = tasks.splice(fromIndex, 1);
      tasks.splice(toIndex, 0, moved);

saveTasks();
      render();
      draggedTaskId = null;
    }

function exportData() {
      const payload = {
        app: "FocusFlow",
        version: 1,
        exportedAt: new Date().toISOString(),
        tasks
      };

const blob = new Blob([JSON.stringify(payload, null, 2)], {
        type: "application/json"
      });

const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `focusflow-backup-${todayISO()}.json`;
      link.click();
      URL.revokeObjectURL(url);
      showToast("Backup exported");
    }

function importData(file) {
      const reader = new FileReader();

reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const importedTasks = Array.isArray(parsed) ? parsed : parsed.tasks;

if (!Array.isArray(importedTasks)) {
            throw new Error("Invalid task file");
          }

tasks = importedTasks.map((task) => ({
            ...task,
            id: task.id || createId(),
            createdAt: task.createdAt || Date.now(),
            checklist: Array.isArray(task.checklist) ? task.checklist : []
          }));

saveTasks();
          render();
          showToast(`${tasks.length} tasks imported`);
        } catch {
          alert("This file is not a valid FocusFlow backup.");
        }
      };

reader.readAsText(file);
    }

function toggleFocusMode() {
      currentFilter = currentFilter === "focus" ? "all" : "focus";

if (currentFilter === "focus") {
        elements.taskList.innerHTML = "";
        const focusTasks = tasks.filter((task) => task.priority === "high" && isToday(task));
        elements.taskList.innerHTML = focusTasks.length
          ? focusTasks.map(renderTask).join("")
          : `<div class="empty-state"><div class="empty-icon">🎯</div><h3>Focus mode is clear</h3><p>No high-priority tasks are due today.</p></div>`;

document.querySelectorAll("[data-filter]").forEach((button) => button.classList.remove("active"));
      } else {
        render();
      }
    }

function updateThemeButton() {
      const isDark = document.documentElement.dataset.theme === "dark";
      $("#themeBtn").textContent = isDark ? "☀️" : "🌙";
      $("#themeBtn").title = isDark ? "Switch to light mode" : "Switch to dark mode";
    }

function toggleTheme() {
      const isDark = document.documentElement.dataset.theme === "dark";
      document.documentElement.dataset.theme = isDark ? "light" : "dark";
      settings.theme = isDark ? "light" : "dark";
      saveSettings();
      updateThemeButton();
    }

let toastTimer;

function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => elements.toast.classList.remove("show"), 2200);
    }

/* =========================
       Event listeners
    ========================== */
    $("#newTaskBtn").addEventListener("click", openNewTask);
    $("#closeModalBtn").addEventListener("click", closeModal);
    $("#cancelModalBtn").addEventListener("click", closeModal);
    elements.taskForm.addEventListener("submit", saveTaskFromForm);

$("#addChecklistBtn").addEventListener("click", () => {
      const row = document.createElement("div");
      row.className = "checklist-row";
      row.innerHTML = `
        <input class="input checklist-input" placeholder="Checklist item" />
        <button type="button" class="icon-button remove-checklist">×</button>
      `;

row.querySelector(".remove-checklist").addEventListener("click", () => row.remove());
      elements.checklistEditor.appendChild(row);
      row.querySelector("input").focus();
    });

$("#themeBtn").addEventListener("click", toggleTheme);
    $("#exportBtn").addEventListener("click", exportData);
    $("#importBtn").addEventListener("click", () => $("#importFile").click());
    $("#importFile").addEventListener("change", (event) => {
      if (event.target.files[0]) importData(event.target.files[0]);
      event.target.value = "";
    });

$("#focusBtn").addEventListener("click", toggleFocusMode);
    elements.searchInput.addEventListener("input", render);
    elements.sortSelect.addEventListener("change", render);

$("#clearCompletedBtn").addEventListener("click", () => {
      const completedCount = tasks.filter((task) => task.completed).length;
      if (!completedCount) {
        showToast("There are no completed tasks");
        return;
      }

if (!confirm(`Remove ${completedCount} completed task${completedCount === 1 ? "" : "s"}?`)) return;

tasks = tasks.filter((task) => !task.completed);
      saveTasks();
      render();
      showToast("Completed tasks cleared");
    });

document.querySelectorAll("[data-filter]").forEach((button) => {
      button.addEventListener("click", () => setFilter(button.dataset.filter));
    });

elements.taskModal.addEventListener("click", (event) => {
      if (event.target === elements.taskModal) closeModal();
    });

document.addEventListener("keydown", (event) => {
      const tag = document.activeElement.tagName.toLowerCase();
      const isTyping = ["input", "textarea", "select"].includes(tag);

if (event.key.toLowerCase() === "n" && !isTyping) {
        event.preventDefault();
        openNewTask();
      }

if (event.key === "Escape") {
        closeModal();
      }
    });

/*
      Expose functions used by inline task-card controls.
    */
    window.openNewTask = openNewTask;
    window.openEditTask = openEditTask;
    window.toggleTask = toggleTask;
    window.toggleChecklist = toggleChecklist;
    window.deleteTask = deleteTask;
    window.setFilter = setFilter;
    window.dragStart = dragStart;
    window.dragOver = dragOver;
    window.dropTask = dropTask;

/* Restore saved theme and render initial UI. */
    document.documentElement.dataset.theme = settings.theme || "light";
    render();
  </script>
</body>
</html>
